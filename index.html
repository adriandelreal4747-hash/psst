<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psst — mensajes anónimos</title>
<meta name="description" content="Recibe mensajes anónimos de tus amigos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --p1:#7c3aed; --p2:#ec4899; --ink:#1f1235; --muted:#6b6280; --card:#ffffff;
    --line:#ece8f3; --ok:#16a34a; --bad:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(160deg,var(--p1),var(--p2));
    color:var(--ink); min-height:100vh;
  }
  #app{max-width:460px;margin:0 auto;padding:28px 18px 60px}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:26px;letter-spacing:-.5px;margin-bottom:22px}
  .brand .dot{width:34px;height:34px;border-radius:12px;background:#fff;color:var(--p1);display:grid;place-items:center;font-size:18px}
  .brand small{font-weight:500;font-size:13px;opacity:.85;margin-left:auto}
  .card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 40px rgba(40,10,70,.25);margin-bottom:16px}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:-.4px}
  h2{font-size:18px;margin:0 0 12px}
  p{margin:0 0 12px;line-height:1.5}
  .muted{color:var(--muted);font-size:14px}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  input[type=text],input[type=password],textarea{
    width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;background:#faf9fc;color:var(--ink)
  }
  input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--p1);background:#fff}
  textarea{resize:none;min-height:130px}
  .prefix{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;background:#faf9fc;overflow:hidden}
  .prefix span{padding:0 4px 0 14px;color:var(--muted);font-weight:600}
  .prefix input{border:0!important;background:transparent!important;padding-left:2px}
  .check{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:14px;margin:12px 0}
  .check input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--p1)}
  button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:16px}
  .btn{width:100%;background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;margin-top:14px}
  a.btn{display:block;box-sizing:border-box;padding:14px 20px;border-radius:999px;font-weight:700;font-size:16px;text-align:center;text-decoration:none}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:#f3effa;color:var(--p1)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-sm{padding:9px 14px;font-size:14px}
  .row{display:flex;gap:8px;align-items:center}
  .row > *{flex:1}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
  .okmsg{color:var(--ok);font-size:14px;margin-top:10px}
  .counter{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
  .ask-head{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;border-radius:24px 24px 0 0;margin:-22px -22px 16px;padding:18px 22px;display:flex;gap:12px;align-items:center}
  .avatar{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
  .ask-head b{display:block}
  .ask-head span{font-size:14px;opacity:.9}
  .linkbox{display:flex;gap:8px;align-items:center;background:#f6f3fb;border-radius:14px;padding:8px 8px 8px 14px}
  .linkbox code{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--p1);font-family:inherit;font-weight:600}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;background:rgba(255,255,255,.2);color:#fff}
  .tabs button.on{background:#fff;color:var(--p1)}
  .msg{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:#faf8fd;margin-bottom:10px;cursor:pointer;border:2px solid transparent;width:100%;text-align:left;font-weight:500;color:var(--ink)}
  .msg:hover{border-color:#e4dbf5}
  .msg .ic{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
  .msg.read .ic{background:#e7e2f0;color:#8b80a0}
  .msg .t{flex:1;min-width:0}
  .msg .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
  .msg .t small{color:var(--muted);font-size:12px;font-weight:400}
  .msg.unread .t div{font-weight:700}
  .empty{text-align:center;padding:26px 10px;color:var(--muted)}
  .empty .big{font-size:44px;margin-bottom:6px}
  .modal-bg{position:fixed;inset:0;background:rgba(20,8,35,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:12px}
  .modal{background:#fff;border-radius:26px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:22px}
  .bubble{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-radius:20px;padding:20px;font-size:18px;font-weight:600;line-height:1.4;word-wrap:break-word;margin-bottom:14px}
  .bubble small{display:block;font-size:12px;font-weight:500;opacity:.85;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
  .preview{width:100%;border-radius:18px;display:block;margin:12px 0;box-shadow:0 8px 20px rgba(0,0,0,.15)}
  .badge{display:inline-block;background:#fff;color:var(--p1);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;margin-left:6px}
  .tip{display:flex;gap:10px;font-size:14px;color:var(--muted);margin:8px 0}
  .tip b{color:var(--ink)}
  .center{text-align:center}
  .spinner{width:34px;height:34px;border:4px solid #eadff8;border-top-color:var(--p1);border-radius:50%;animation:spin 1s linear infinite;margin:10px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{color:rgba(255,255,255,.85);font-size:12px;text-align:center;margin-top:18px;line-height:1.5}
  .topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;margin:-8px 0 14px;font-size:14px}
  .topbar b{font-weight:700}
  .logout{background:rgba(255,255,255,.2);color:#fff;padding:8px 14px;font-size:14px}
  .logout:hover{background:rgba(255,255,255,.3)}
  .warn{background:#fff7ed;color:#9a3412;border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:12px}

</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=2"></script>
<script>
// ===== Configuración (los datos de Supabase están en config.js) =====
const SUPABASE_URL = (window.PSST_CONFIG || {}).url || "PEGA_";
const SUPABASE_KEY = (window.PSST_CONFIG || {}).key || "PEGA_";
const MAX_LEN = 300;
const RATE_MAX = 5, RATE_WINDOW = 10 * 60 * 1000;

const BLOCKED = [
  "puta","puto","pendej","idiota","estupid","imbecil","naco","gorda","fea","feo",
  "maric","joto","zorra","perra","verga","culer","chinga tu","hijo de puta","hdp","mamon","pinche",
  "matate","matarte","te voy a matar","te voy a pegar","suicid","muerete","ojala te mueras","nadie te quiere",
  "te odio","asco","retrasad","mongol","nude","nudes","pack","fuck","bitch","kill yourself","kys","slut","whore"
];

const S = { sb:null, session:null, profile:undefined, msgs:[], msgsLoaded:false, tab:"inbox", authMode:"login", poll:null };

// ===== Utilidades =====
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
const app = document.getElementById("app");
function render(...nodes){ app.replaceChildren(brand(), ...nodes, footer()); }
function brand(){ return h("div",{class:"brand"}, h("div",{class:"dot"},"🤫"), "psst", h("small",{}, "mensajes anónimos")); }
function footer(){ return h("div",{class:"foot"}, "Solo para mayores de 18 años. Psst nunca revela quién envió un mensaje y nunca genera mensajes falsos."); }
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function isOffensive(text){
  const t = " " + norm(text).replace(/[^a-z0-9ñ ]/g," ").replace(/\s+/g," ") + " ";
  return BLOCKED.some(w => t.includes(norm(w)));
}
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return "hace un momento";
  const m = Math.floor(s/60); if (m < 60) return `hace ${m} min`;
  const hr = Math.floor(m/60); if (hr < 24) return `hace ${hr} h`;
  const d = Math.floor(hr/24); return d === 1 ? "ayer" : `hace ${d} días`;
}
function baseUrl(){ return location.origin + location.pathname; }
function myLink(){ return baseUrl() + "?u=" + S.profile.username; }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function rateList(){ const now = Date.now(); return (lsGet("psst_sent")||[]).filter(t => now - t < RATE_WINDOW); }
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); btn.textContent = "¡Copiado!"; }
  catch(e){ btn.textContent = "Selecciónalo y cópialo"; }
  setTimeout(()=>{ btn.textContent = "Copiar"; }, 1800);
}
function loadingView(text){ return h("div",{class:"card center"}, h("div",{class:"spinner"}), h("p",{class:"muted"}, text)); }
function messageView(title, text){ return h("div",{class:"card center"}, h("h1",{}, title), h("p",{class:"muted"}, text)); }
function authErrorText(e){
  const m = (e && e.message || "").toLowerCase();
  if (m.includes("invalid login")) return "Correo o contraseña incorrectos.";
  if (m.includes("already registered")) return "Ese correo ya tiene cuenta. Inicia sesión.";
  if (m.includes("password")) return "La contraseña debe tener al menos 6 caracteres.";
  if (m.includes("email not confirmed")) return "Confirma tu correo: te enviamos un enlace.";
  if (m.includes("rate limit")) return "Demasiados intentos. Espera unos minutos.";
  if (m.includes("email")) return "Revisa que el correo esté bien escrito.";
  return "Algo salió mal. Intenta de nuevo.";
}

// ===== Arranque =====
async function init(){
  if (SUPABASE_KEY.startsWith("PEGA_") || SUPABASE_URL.startsWith("PEGA_")){
    render(messageView("Falta configurar", "Pega la URL y la clave de Supabase en el archivo config.js."));
    return;
  }
  S.sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const u = new URLSearchParams(location.search).get("u");
  if (u) return showSend(u.toLowerCase());
  render(loadingView("Cargando…"));
  const { data } = await S.sb.auth.getSession();
  S.session = data.session;
  S.sb.auth.onAuthStateChange((_ev, session) => {
    const changed = (session && session.user.id) !== (S.session && S.session.user.id);
    S.session = session;
    if (changed) startHome();
  });
  startHome();
}

async function startHome(){
  clearInterval(S.poll); S.poll = null;
  S.msgs = []; S.msgsLoaded = false; S.profile = undefined;
  if (!S.session) return render(authView());
  render(loadingView("Cargando tu perfil…"));
  const uid = S.session.user.id;
  let { data: prof, error } = await S.sb.from("profiles").select("*").eq("id", uid).maybeSingle();
  if (error) return render(messageView("Sin conexión", "No pudimos cargar tu perfil. Recarga la página."));
  if (!prof){
    // Crear el perfil con el usuario elegido al registrarse
    const wanted = (S.session.user.user_metadata || {}).username;
    if (wanted){
      const r = await S.sb.from("profiles").insert({ id: uid, username: wanted }).select().single();
      if (!r.error) prof = r.data;
    }
  }
  S.profile = prof || null;
  if (!S.profile) return render(pickUsernameView());
  renderHome();
  loadMsgs();
  S.poll = setInterval(loadMsgs, 20000);
}

async function loadMsgs(){
  if (!S.profile) return;
  const { data, error } = await S.sb.from("messages")
    .select("id, body, is_read, created_at").eq("reported", false)
    .order("created_at", { ascending:false }).limit(200);
  if (error) return;
  const sig = JSON.stringify(data);
  if (sig === S.lastSig && S.msgsLoaded) return;
  S.lastSig = sig; S.msgs = data; S.msgsLoaded = true;
  if (!document.querySelector(".modal-bg")) renderHome();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.profile) loadMsgs(); });

// ===== Iniciar sesión / crear cuenta =====
function authView(){
  const isLogin = S.authMode === "login";
  const user = h("input",{type:"text", maxlength:"20", placeholder:"tu_usuario", autocomplete:"off"});
  user.addEventListener("input", () => { user.value = user.value.toLowerCase().replace(/[^a-z0-9-]/g,""); });
  const email = h("input",{type:"text", inputmode:"email", placeholder:"tu@correo.com", autocomplete:"email"});
  const pass = h("input",{type:"password", placeholder:"Mínimo 6 caracteres", autocomplete: isLogin ? "current-password" : "new-password"});
  const age = h("input",{type:"checkbox"});
  const terms = h("input",{type:"checkbox"});
  const err = h("div",{class:"err"});
  const btn = h("button",{class:"btn"}, isLogin ? "Iniciar sesión" : "Crear mi cuenta");

  btn.addEventListener("click", async () => {
    err.textContent = "";
    const em = email.value.trim(), pw = pass.value;
    if (!em || !pw){ err.textContent = "Escribe tu correo y contraseña."; return; }
    btn.disabled = true;
    if (isLogin){
      btn.textContent = "Entrando…";
      const { error } = await S.sb.auth.signInWithPassword({ email: em, password: pw });
      if (error){ err.textContent = authErrorText(error); btn.disabled = false; btn.textContent = "Iniciar sesión"; }
      return;
    }
    const name = user.value.trim();
    const fail = (t) => { err.textContent = t; btn.disabled = false; btn.textContent = "Crear mi cuenta"; };
    if (!/^[a-z0-9-]{3,20}$/.test(name)) return fail("Usuario: de 3 a 20 letras, números o guiones.");
    if (!age.checked) return fail("Debes tener 18 años o más para usar Psst.");
    if (!terms.checked) return fail("Acepta las reglas de la comunidad para continuar.");
    btn.textContent = "Creando…";
    const taken = await S.sb.from("profiles").select("id").eq("username", name).maybeSingle();
    if (taken.data) return fail("Ese usuario ya está ocupado, prueba otro.");
    const { data, error } = await S.sb.auth.signUp({
      email: em, password: pw,
      options: { data: { username: name }, emailRedirectTo: baseUrl() }
    });
    if (error) return fail(authErrorText(error));
    if (!data.session){
      render(messageView("Revisa tu correo 📬", "Te enviamos un enlace a " + em + " para activar tu cuenta. Después vuelve aquí e inicia sesión."));
    }
  });

  const kids = [
    h("h1",{}, isLogin ? "Bienvenido de nuevo" : "Crea tu cuenta"),
    h("p",{class:"muted"}, isLogin ? "Entra para ver tus mensajes anónimos." : "Crea tu link, compártelo en tus historias y recibe mensajes anónimos."),
  ];
  if (!isLogin) kids.push(h("label",{}, "Usuario"), h("div",{class:"prefix"}, h("span",{}, "psst/"), user));
  kids.push(h("label",{}, "Correo"), email, h("label",{}, "Contraseña"), pass);
  if (!isLogin) kids.push(
    h("label",{class:"check"}, age, h("span",{}, "Confirmo que tengo 18 años o más.")),
    h("label",{class:"check"}, terms, h("span",{}, "Acepto las reglas: nada de acoso, amenazas ni contenido sexual."))
  );
  kids.push(btn, err,
    h("button",{class:"btn btn-ghost", onclick:()=>{ S.authMode = isLogin ? "signup" : "login"; render(authView()); }},
      isLogin ? "➕ Crear una cuenta nueva" : "Ya tengo cuenta, iniciar sesión"));
  return h("div",{class:"card"}, ...kids);
}

function pickUsernameView(){
  const user = h("input",{type:"text", maxlength:"20", placeholder:"tu_usuario", autocomplete:"off"});
  user.addEventListener("input", () => { user.value = user.value.toLowerCase().replace(/[^a-z0-9-]/g,""); });
  const err = h("div",{class:"err"});
  const btn = h("button",{class:"btn"}, "Guardar");
  btn.addEventListener("click", async () => {
    const name = user.value.trim();
    if (!/^[a-z0-9-]{3,20}$/.test(name)){ err.textContent = "De 3 a 20 letras, números o guiones."; return; }
    btn.disabled = true;
    const { error } = await S.sb.from("profiles").insert({ id: S.session.user.id, username: name });
    if (error){ err.textContent = error.code === "23505" ? "Ese usuario ya está ocupado." : "No se pudo guardar."; btn.disabled = false; return; }
    startHome();
  });
  return h("div",{class:"card"}, h("h1",{}, "Elige tu usuario"),
    h("div",{class:"prefix"}, h("span",{}, "psst/"), user), btn, err,
    h("button",{class:"btn btn-ghost", onclick:logout}, "Cerrar sesión"));
}

async function logout(){
  clearInterval(S.poll); S.poll = null;
  await S.sb.auth.signOut();
  S.session = null; S.authMode = "login";
  render(authView());
}

// ===== Bandeja =====
function renderHome(){
  if (!S.profile) return;
  const unread = S.msgs.filter(m => !m.is_read).length;
  render(
    h("div",{class:"topbar"}, h("span",{}, "Hola, ", h("b",{}, "@" + S.profile.username)),
      h("button",{class:"logout", onclick:logout}, "Cerrar sesión")),
    h("div",{class:"tabs"},
      h("button",{class: S.tab==="inbox" ? "on" : "", onclick:()=>{S.tab="inbox"; renderHome();}}, "Bandeja", unread ? h("span",{class:"badge"}, unread) : null),
      h("button",{class: S.tab==="link" ? "on" : "", onclick:()=>{S.tab="link"; renderHome();}}, "Mi link")),
    S.tab === "inbox" ? inboxList() : linkCard()
  );
}

function inboxList(){
  const card = h("div",{class:"card"}, h("h2",{}, "Tus mensajes"));
  if (!S.msgsLoaded){ card.append(h("div",{class:"spinner"})); return card; }
  if (!S.msgs.length){
    card.append(h("div",{class:"empty"}, h("div",{class:"big"}, "📭"), h("p",{}, "Todavía no tienes mensajes."),
      h("button",{class:"btn btn-sm", onclick:()=>{S.tab="link"; renderHome();}}, "Comparte tu link")));
    return card;
  }
  for (const m of S.msgs){
    card.append(h("button",{class:"msg " + (m.is_read ? "read" : "unread"), onclick:()=>openMsg(m)},
      h("div",{class:"ic"}, m.is_read ? "✉️" : "💌"),
      h("div",{class:"t"}, h("div",{}, m.is_read ? m.body : "Nuevo mensaje anónimo"), h("small",{}, timeAgo(m.created_at)))));
  }
  return card;
}

function linkCard(){
  const link = myLink();
  const copyBtn = h("button",{class:"btn-dark btn-sm"}, "Copiar");
  copyBtn.addEventListener("click", () => copyText(link, copyBtn));
  return h("div",{},
    h("div",{class:"card"}, h("h2",{}, "Tu link personal"),
      h("div",{class:"linkbox"}, h("code",{}, link), copyBtn),
      h("p",{class:"muted", style:"margin-top:12px"}, "Cualquier persona con este link puede mandarte un mensaje anónimo, sin crear cuenta."),
      h("a",{class:"btn btn-ghost", href:link, style:"display:block;text-align:center;text-decoration:none"}, "Ver cómo lo ven tus amigos")),
    h("div",{class:"card"}, h("h2",{}, "Cómo conseguir más mensajes"),
      h("div",{class:"tip"}, "1️⃣", h("span",{}, h("b",{}, "Copia tu link"), " con el botón de arriba.")),
      h("div",{class:"tip"}, "2️⃣", h("span",{}, h("b",{}, "Sube una historia"), " a Instagram o TikTok con el sticker de “Enlace”.")),
      h("div",{class:"tip"}, "3️⃣", h("span",{}, h("b",{}, "Responde"), " y comparte tus respuestas como imagen.")))
  );
}

function openMsg(m){
  if (!m.is_read){ m.is_read = true; S.sb.from("messages").update({ is_read:true }).eq("id", m.id).then(()=>{}); }
  const close = () => { bg.remove(); renderHome(); };
  const replyBox = h("textarea",{maxlength:"200", placeholder:"Escribe tu respuesta…", style:"min-height:90px"});
  const preview = h("div",{});
  const status = h("div",{class:"err"});
  let armed = false;
  const delBtn = h("button",{class:"btn-ghost btn-sm"}, "Eliminar");
  delBtn.addEventListener("click", async () => {
    if (!armed){ armed = true; delBtn.textContent = "¿Seguro? Toca otra vez"; return; }
    const { error } = await S.sb.from("messages").delete().eq("id", m.id);
    if (error){ status.textContent = "No se pudo eliminar."; return; }
    S.msgs = S.msgs.filter(x => x.id !== m.id); close();
  });
  const reportBtn = h("button",{class:"btn-ghost btn-sm"}, "Reportar");
  reportBtn.addEventListener("click", async () => {
    const { error } = await S.sb.from("messages").update({ reported:true }).eq("id", m.id);
    if (error){ status.textContent = "No se pudo reportar."; return; }
    S.msgs = S.msgs.filter(x => x.id !== m.id); close();
  });
  const makeBtn = h("button",{class:"btn"}, "Crear imagen para historia");
  makeBtn.addEventListener("click", () => {
    const url = makeStoryImage(m.body, replyBox.value.trim(), S.profile.username);
    const copyBtn = h("button",{class:"btn-dark btn-sm"}, "Copiar");
    copyBtn.addEventListener("click", () => copyText(myLink(), copyBtn));
    preview.replaceChildren(
      h("img",{class:"preview", src:url, alt:"Imagen para tu historia"}),
      h("a",{class:"btn btn-dark", href:url, download:"psst-respuesta.png", style:"display:block;text-align:center;text-decoration:none"}, "Descargar imagen"),
      h("p",{class:"muted center", style:"margin-top:10px"}, "Súbela a tu historia y agrega tu link:"),
      h("div",{class:"linkbox"}, h("code",{}, myLink()), copyBtn));
  });
  const bg = h("div",{class:"modal-bg", onclick:(e)=>{ if (e.target === bg) close(); }},
    h("div",{class:"modal"},
      h("div",{class:"bubble"}, h("small",{}, "Mensaje anónimo · " + timeAgo(m.created_at)), m.body),
      h("label",{}, "Tu respuesta"), replyBox, makeBtn, preview,
      h("div",{class:"row", style:"margin-top:14px"}, reportBtn, delBtn, h("button",{class:"btn-ghost btn-sm", onclick:close}, "Cerrar")),
      status));
  document.body.append(bg);
}

// ===== Imagen para historias =====
function wrapLines(ctx, text, maxW, maxLines){
  const words = text.split(/\s+/); const lines = []; let cur = "";
  for (const w of words){
    const test = cur ? cur + " " + w : w;
    if (ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines){ lines.length = maxLines; lines[maxLines-1] += "…"; }
  return lines;
}
function roundRect(ctx, x, y, w, hh, r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+hh,r); ctx.arcTo(x+w,y+hh,x,y+hh,r);
  ctx.arcTo(x,y+hh,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function makeStoryImage(question, answer, username){
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1920;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0,0,1080,1920); g.addColorStop(0,"#7c3aed"); g.addColorStop(1,"#ec4899");
  x.fillStyle = g; x.fillRect(0,0,1080,1920);
  x.font = "600 58px Inter, sans-serif";
  const qLines = wrapLines(x, question, 780, 8);
  const headH = 130, pad = 70, lineH = 76;
  const cardH = headH + pad + qLines.length*lineH + pad - 20;
  const cardY = answer ? 420 : 760 - cardH/2;
  x.save(); x.shadowColor = "rgba(0,0,0,.25)"; x.shadowBlur = 50; x.shadowOffsetY = 20;
  roundRect(x,110,cardY,860,cardH,56); x.fillStyle = "#fff"; x.fill(); x.restore();
  x.save(); roundRect(x,110,cardY,860,cardH,56); x.clip();
  const hg = x.createLinearGradient(110,0,970,0); hg.addColorStop(0,"#7c3aed"); hg.addColorStop(1,"#ec4899");
  x.fillStyle = hg; x.fillRect(110,cardY,860,headH); x.restore();
  x.fillStyle = "#fff"; x.font = "800 46px Inter, sans-serif"; x.textAlign = "center";
  x.fillText("envíame mensajes anónimos", 540, cardY + 82);
  x.fillStyle = "#1f1235"; x.font = "600 58px Inter, sans-serif";
  qLines.forEach((l,i) => x.fillText(l, 540, cardY + headH + pad + 30 + i*lineH));
  if (answer){
    x.fillStyle = "#fff"; x.font = "800 72px Inter, sans-serif";
    wrapLines(x, answer, 860, 6).forEach((l,i) => x.fillText(l, 540, cardY + cardH + 170 + i*92));
  }
  x.fillStyle = "rgba(255,255,255,.9)"; x.font = "600 40px Inter, sans-serif";
  x.fillText("🤫 psst · @" + username, 540, 1800);
  return c.toDataURL("image/png");
}

// ===== Página pública para enviar =====
async function showSend(username){
  render(loadingView("Buscando a @" + username + "…"));
  const { data: prof, error } = await S.sb.from("profiles").select("id, username").eq("username", username).maybeSingle();
  if (error) return render(messageView("Sin conexión", "No pudimos cargar esta página. Intenta de nuevo."));
  if (!prof) return render(messageView("Usuario no encontrado", "El link @" + username + " no existe."),
    h("a",{class:"btn btn-dark", href:baseUrl(), style:"display:block;text-align:center;text-decoration:none"}, "Crear mi propio link"));
  render(sendForm(prof));
}

function sendForm(prof){
  const ta = h("textarea",{maxlength:String(MAX_LEN), placeholder:"Mándame un mensaje anónimo…"});
  const counter = h("div",{class:"counter"}, "0/" + MAX_LEN);
  const err = h("div",{class:"err"});
  const btn = h("button",{class:"btn btn-dark", disabled:true}, "Enviar 🤫");
  ta.addEventListener("input", () => { counter.textContent = ta.value.length + "/" + MAX_LEN; btn.disabled = ta.value.trim().length < 2; err.textContent = ""; });
  btn.addEventListener("click", async () => {
    const text = ta.value.trim();
    if (text.length < 2) return;
    if (isOffensive(text)){ err.textContent = "Tu mensaje parece ofensivo y no se enviará. Psst es un lugar sin acoso."; return; }
    const list = rateList();
    if (list.length >= RATE_MAX){ err.textContent = "Enviaste muchos mensajes seguidos. Espera unos minutos."; return; }
    btn.disabled = true; btn.textContent = "Enviando…";
    // No se guarda nada que identifique a quien envía
    const { error } = await S.sb.from("messages").insert({ recipient: prof.id, body: text });
    if (error){ err.textContent = "No se pudo enviar. Intenta de nuevo en un momento."; btn.disabled = false; btn.textContent = "Enviar 🤫"; return; }
    list.push(Date.now()); lsSet("psst_sent", list);
    render(h("div",{class:"card center"},
      h("div",{style:"font-size:56px"}, "✅"), h("h1",{}, "¡Enviado!"),
      h("p",{class:"muted"}, "Tu mensaje llegó a @" + prof.username + " de forma anónima."),
      h("button",{class:"btn btn-ghost", onclick:()=>render(sendForm(prof))}, "Enviar otro mensaje"),
      h("a",{class:"btn", href:baseUrl(), style:"display:block;text-align:center;text-decoration:none"}, "¡Quiero mis propios mensajes!")));
  });
  return h("div",{class:"card"},
    h("div",{class:"ask-head"}, h("div",{class:"avatar"}, prof.username[0].toUpperCase()),
      h("div",{}, h("b",{}, "@" + prof.username), h("span",{}, "envíame mensajes anónimos"))),
    ta, counter, btn, err,
    h("p",{class:"muted center", style:"margin-top:14px"}, "🔒 Anónimo: @" + prof.username + " no verá quién eres."));
}
